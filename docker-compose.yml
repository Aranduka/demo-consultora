services:
  db:
    image: mysql:8.4
    container_name: consultora_db
    restart: unless-stopped
    env_file: .env
    ports:
      - "13001:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: ./app
    container_name: consultora_app
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npm run dev"
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Asuncion
    ports:
      - "13000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next

  landing:
    build: ./landing
    container_name: consultora_landing
    environment:
      NEXT_PUBLIC_APP_URL: http://localhost:13000
    restart: unless-stopped
    ports:
      - "13002:3000"
    volumes:
      - ./landing:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/.next

volumes:
  db_data:
